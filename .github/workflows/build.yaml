name: Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # GITHUB_TOKEN can only push packages owned by this repo's own account/org
      # (lowercased: GHCR requires lowercase image names), so resolve the image
      # ref from the actual repository owner instead of hardcoding one -- a
      # hardcoded owner here fails the push step on any fork/mirror with
      # "denied: permission_denied: The requested installation does not exist."
      - name: Resolve image ref
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hermes-operator" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      # Multi-arch builds for releases happen in release.yaml via
      # docker/build-push-action (uses Go cross-compile under
      # BUILDPLATFORM, not QEMU). This job is a fast PR smoke test:
      # single-platform, host-arch.
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.img.outputs.image }}:dev,${{ steps.img.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
